name: CI

on:
  push:
    branches: [ main, master, "claude/**" ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev zlib1g-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: End-to-end transfer test
        run: bash tests/e2e.sh build/bandrop 9091

      - name: End-to-end pipe test
        run: bash tests/pipe_e2e.sh build/bandrop 9111

      - name: End-to-end serve test
        run: bash tests/serve_e2e.sh build/bandrop 8071

      - name: End-to-end receipt test
        run: bash tests/receipt_e2e.sh build/bandrop 9130

      - name: End-to-end broadcast test
        run: bash tests/broadcast_e2e.sh build/bandrop 9220

      - name: End-to-end resume test
        run: bash tests/resume_e2e.sh build/bandrop 9310

      - name: QR reference verification
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --quiet qrcode
          g++ -std=c++17 -O2 -o /tmp/qrdump tests/qrdump.cpp
          python3 tests/qr_verify.py
